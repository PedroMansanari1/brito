<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>Skill lifecycle: from a hard task to an approved skill</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#445"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3f7a4f"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a24f6c"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a58b5"/></marker>
  </defs>
  <rect width="1200" height="420" fill="#fff"/>

  <!-- Task -->
  <rect x="20" y="150" width="190" height="110" rx="14" fill="#e8edf7" stroke="#2c4f94" stroke-width="2"/>
  <text x="115" y="185" text-anchor="middle" font-size="17" fill="#2c4f94" font-weight="600">Task</text>
  <text x="115" y="208" text-anchor="middle" font-size="12" fill="#445">tripped, was corrected,</text>
  <text x="115" y="226" text-anchor="middle" font-size="12" fill="#445">or repeated across sessions</text>

  <line x1="210" y1="205" x2="262" y2="205" stroke="#445" stroke-width="3" marker-end="url(#a)"/>

  <!-- Reflection -->
  <rect x="266" y="150" width="170" height="110" rx="14" fill="#fff" stroke="#445" stroke-width="2"/>
  <text x="351" y="185" text-anchor="middle" font-size="17" fill="#223" font-weight="600">Reflection</text>
  <text x="351" y="208" text-anchor="middle" font-size="12" fill="#445">writes a draft skill</text>
  <text x="351" y="226" text-anchor="middle" font-size="12" fill="#445">+ runs the safety lint</text>

  <!-- split -->
  <path d="M436,190 C470,190 470,90 520,90" fill="none" stroke="#3f7a4f" stroke-width="3" marker-end="url(#ag)"/>
  <path d="M436,225 C470,225 470,320 520,320" fill="none" stroke="#7a58b5" stroke-width="3" marker-end="url(#ap)"/>
  <text x="462" y="104" text-anchor="end" font-size="12" fill="#3f7a4f">safe: autonomous path</text>
  <text x="462" y="352" text-anchor="end" font-size="12" fill="#7a58b5">risky, or edits one</text><text x="462" y="368" text-anchor="end" font-size="12" fill="#7a58b5">you approved</text>

  <!-- Trial -->
  <rect x="524" y="40" width="210" height="100" rx="14" fill="#fff7e0" stroke="#c99a1a" stroke-width="2"/>
  <text x="629" y="72" text-anchor="middle" font-size="17" fill="#8a6700" font-weight="600">In trial</text>
  <text x="629" y="94" text-anchor="middle" font-size="12" fill="#445">marked "(em teste)" in the index</text>
  <text x="629" y="112" text-anchor="middle" font-size="12" fill="#445">each load = a win or a loss</text>

  <!-- Pending -->
  <rect x="524" y="270" width="210" height="100" rx="14" fill="#f0eaf8" stroke="#7a58b5" stroke-width="2"/>
  <text x="629" y="302" text-anchor="middle" font-size="17" fill="#7a58b5" font-weight="600">Pending</text>
  <text x="629" y="324" text-anchor="middle" font-size="12" fill="#445">/skills pending shows the</text>
  <text x="629" y="342" text-anchor="middle" font-size="12" fill="#445">whole body + lint warnings</text>

  <!-- Skills -->
  <rect x="900" y="150" width="270" height="110" rx="14" fill="#e9f1ea" stroke="#3f7a4f" stroke-width="3"/>
  <text x="1035" y="185" text-anchor="middle" font-size="17" fill="#3f7a4f" font-weight="600">Active skill</text>
  <text x="1035" y="208" text-anchor="middle" font-size="12" fill="#445">.brito/skills · versioned in history/</text>
  <text x="1035" y="226" text-anchor="middle" font-size="12" fill="#445">loaded with skill_load before a task</text>

  <path d="M734,80 C830,80 830,170 896,180" fill="none" stroke="#3f7a4f" stroke-width="3" marker-end="url(#ag)"/>
  <text x="760" y="150" font-size="12" fill="#3f7a4f" font-weight="600">3 clean uses</text>

  <path d="M734,330 C830,330 830,240 896,232" fill="none" stroke="#7a58b5" stroke-width="3" marker-end="url(#ap)"/>
  <text x="772" y="352" font-size="12" fill="#7a58b5" font-weight="600">/skills approve (you confirm)</text>

  <!-- Trash -->
  <rect x="900" y="40" width="270" height="76" rx="14" fill="#f7ebef" stroke="#a24f6c" stroke-width="2"/>
  <text x="1035" y="70" text-anchor="middle" font-size="17" fill="#a24f6c" font-weight="600">Archived (.trash)</text>
  <text x="1035" y="90" text-anchor="middle" font-size="12" fill="#445">2 stumbles, or 21 idle days</text><text x="1035" y="106" text-anchor="middle" font-size="11" fill="#667">recoverable</text>
  <text x="815" y="50" text-anchor="middle" font-size="12" fill="#a24f6c" font-weight="600">2 losses</text><line x1="734" y1="58" x2="896" y2="58" stroke="#a24f6c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
</svg>
